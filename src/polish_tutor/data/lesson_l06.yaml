  - prompt: słowo — give the genitive singular and plural
    answers:
    - słowa, słów
  - prompt: święto — give the genitive singular and plural
    answers:
    - święta, świąt
  - prompt: narzędzie — give the genitive singular and plural
    answers:
    - narzędzia, narzędzi
  - prompt: zebranie — give the genitive singular and plural
    answers:
    - zebrania, zebrań
  - prompt: szkło — give the genitive singular and plural
    answers:
    - szkła, szkieł
  - prompt: opowiadanie — give the genitive singular and plural
    answers:
