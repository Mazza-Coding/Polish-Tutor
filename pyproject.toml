[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polish-typing-tutor"
version = "0.3.0"
description = "An offline, typing-only Polish tutor with FSRS scheduling."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "OpenAI" }]
dependencies = [
    "textual>=8.2,<9",
    "fsrs>=6.3,<7",
    "platformdirs>=4.4,<5",
    "PyYAML>=6.0,<7",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
polish-tutor = "polish_tutor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polish_tutor = ["data/*.yaml", "styles.tcss"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_course.py" = ["E501"]
